<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cororo オンライン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f5f6;--panel:#fff;--ink:#23262d;--mute:#6c717b;--line:#e4e6e9;--chip:#eceef0;--btn:#f0f1f3;--boardbg:#eceef0;--grid:#cdd0d5;--gdot:#b9bdc4;--me:#2457f5;--cpu:#f2623f;--acc:#2a2d34;--accfg:#fff;--mk:#9ca1aa;--push:#c58a42;--ovl:rgba(24,26,32,.5);--shadow:0 1px 2px rgba(24,26,32,.06),0 4px 14px rgba(24,26,32,.06);--shadow2:0 1px 2px rgba(24,26,32,.06),0 10px 30px rgba(24,26,32,.1);
--step:clamp(36px,min(calc((100vh - 240px)/6.2),calc((100vw - 780px)/6.2)),84px);--pad:calc(var(--step)*.55)}
[data-theme=dark]{color-scheme:dark;--bg:#121316;--panel:#1b1d22;--ink:#e6e8ec;--mute:#9a9fa9;--line:#2b2e35;--chip:#23262c;--btn:#24272e;--boardbg:#22252b;--grid:#3b3f48;--gdot:#4b505b;--me:#6b8cff;--cpu:#ff7f5e;--acc:#e6e8ec;--accfg:#121316;--mk:#848a95;--push:#d9b26a;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow2:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:var(--ink);border:0;background:var(--btn);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button:not(:disabled):hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:var(--accfg)}
button.big{padding:13px 18px;font-size:15px;border-radius:14px;width:100%}
button.pill[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
input[type=text]{font:inherit;color:var(--ink);background:var(--btn);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
.muted{color:var(--mute)}.small{font-size:12px;line-height:1.6}
.card{background:var(--panel);border-radius:20px;padding:24px;box-shadow:var(--shadow2);display:flex;flex-direction:column;gap:12px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.narrow{width:min(440px,100%)}
.logo{width:36px;height:36px;display:inline-block;flex:none;vertical-align:middle}
.logo svg{display:block;width:100%;height:100%}
.title{margin:0;font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px}
.title small{font-size:13px;font-weight:500;color:var(--mute)}
h2{margin:0;font-size:20px}h3{margin:8px 0 0;font-size:14px}
.lead{margin:0;color:var(--mute);font-size:13px;line-height:1.8}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:stretch}.grow{flex:1 1 0;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.srow{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crow input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}.crow input[type=text]{width:92px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-family:ui-monospace,Menlo,monospace}.cprev{width:26px;height:26px;border-radius:50%;display:inline-block;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{position:relative;display:inline-block}.swb{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}.swx{position:absolute;right:-6px;top:-6px;width:16px;height:16px;padding:0;border-radius:50%;font-size:11px;line-height:1;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;background:var(--btn);border-radius:12px;padding:9px 12px}
.plist .name{flex:1;font-weight:700;min-width:0}
.tag{font-size:11px;font-weight:600;background:var(--chip);color:var(--mute);border-radius:999px;padding:2px 9px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;display:block;flex:none}
.c0{background:var(--me)}.c1{background:var(--cpu)}

/* 対局画面 */
#game{min-height:100vh;display:flex;flex-direction:column}
.bar{min-height:64px;flex:none;background:var(--panel);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 20px}
.brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.brand small{font-size:12px;font-weight:500;color:var(--mute)}
.chip{font-size:12px;font-weight:600;background:var(--chip);color:var(--mute);border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip.acc{background:var(--acc);color:var(--accfg)}
.body{flex:1;min-height:0;padding:20px;display:flex;gap:20px}
.left{width:272px;flex:none;display:flex;flex-direction:column;gap:12px}
.right{width:296px;flex:none;display:flex;flex-direction:column;gap:12px}
.mapcol{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.panel{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:none;box-shadow:var(--shadow)}
.lab{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.pcard{background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:none;box-shadow:var(--shadow);outline:2px solid transparent;outline-offset:-2px}
.pcard.cur{outline-color:var(--acc)}
.phead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.phead .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms{display:flex;align-items:center;gap:10px;font-size:12px}.ms .k{color:var(--mute);width:64px;flex:none}.ms b{min-width:28px;text-align:right}
.segs{flex:1;display:flex;gap:3px}.segs i{flex:1;height:8px;border-radius:4px;background:var(--line);display:block}.segs i.on{background:var(--acc)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.step.cur{color:var(--ink);font-weight:700}
.sn{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--mute);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.cur .sn{background:var(--acc);color:var(--accfg)}.step.done .sn{background:var(--me);color:#fff}
.hint{position:absolute;left:0;top:0;background:var(--panel);border-radius:999px;font-size:12px;font-weight:600;padding:6px 14px;box-shadow:var(--shadow);max-width:100%}
.mid{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.bar2{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.bar2 .who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink)}
.bwrap{background:transparent;border-radius:24px;padding:14px}
.board{position:relative;width:calc(var(--step)*5 + var(--pad)*2);height:calc(var(--step)*5 + var(--pad)*2);background:transparent;filter:drop-shadow(0 2px 6px rgba(24,26,32,.14));border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.ln{position:absolute;background:var(--grid);border-radius:1px;pointer-events:none}
.ln.h{height:2px;left:var(--pad);width:calc(var(--step)*5);margin-top:-1px}
.ln.v{width:2px;top:var(--pad);height:calc(var(--step)*5);margin-left:-1px}
.gd{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gdot);pointer-events:none}
.at{left:calc(var(--pad) + var(--c)*var(--step));top:calc(var(--pad) + var(--r)*var(--step))}
.pc{position:absolute;padding:0;border-radius:50%;transform:translate(-50%,-50%);left:calc(var(--pad) + var(--c)*var(--step));top:calc(var(--pad) + var(--r)*var(--step));transition:left .24s ease,top .24s ease,opacity .35s ease,box-shadow .15s;box-shadow:0 2px 6px rgba(24,26,32,.28);z-index:2}
.pc.k0{width:calc(var(--step)*.34);height:calc(var(--step)*.34)}
.pc.k1{width:calc(var(--step)*.34);height:calc(var(--step)*.34);border-radius:18%}
.pc.k2{width:calc(var(--step)*.68);height:calc(var(--step)*.68)}
.pc.s0{background:var(--me)}.pc.s1{background:var(--cpu)}
.pc.sel{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--acc);z-index:4}
.pc.pvc{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--push);z-index:4}
.pc.pvf{box-shadow:0 0 0 3px var(--panel),0 0 0 6px #bf5a55;opacity:.55;z-index:4}
.tile{position:absolute;background:var(--boardbg);z-index:0;pointer-events:none;transform-origin:50% 50%}
.tile .th{position:absolute;height:2px;margin-top:-1px;background:var(--grid);border-radius:1px}
.tile .tv{position:absolute;width:2px;margin-left:-1px;background:var(--grid);border-radius:1px}
.tile .td{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gdot)}
.tile.pend::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(191,90,85,.4);animation:pendp 1.4s ease-in-out infinite}
.tile.pend.soon::after{animation-duration:.6s;background:rgba(191,90,85,.42)}
@keyframes pendp{50%{opacity:.15}}
.tile.tfall{animation:tfall 1s cubic-bezier(.5,0,.9,.5) forwards;z-index:-1}
@keyframes tfall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}15%{transform:translateY(-3px) rotate(-1deg) scale(1.01);opacity:1}100%{transform:translateY(90px) rotate(7deg) scale(.7);opacity:0}}
.tut .tt{font-size:16px;margin:4px 0 6px}
.tut .tx{font-size:13px;line-height:1.75;margin:6px 0 10px}
.tut .tl{margin:0;padding-left:18px}.tut .tl li{margin:4px 0}
.tut .task{background:var(--chip);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;line-height:1.6;margin:8px 0 12px}
.tut .task.ok{background:#e4ece6;color:#365a43}
[data-theme=dark] .tut .task.ok{background:#1f2a23;color:#a3c9b0}
.tutbtn{flex-wrap:wrap;gap:8px}
.chip.warn{background:#bf5a55;color:#fff}
.dot.cx{background:var(--mute)}
@media (prefers-reduced-motion:reduce){.tile.pend::after{animation:none}.tile.tfall{animation-duration:.01s}}
.pc.fall{opacity:0;z-index:1;pointer-events:none;transition:left .6s cubic-bezier(.5,0,.9,.6),top .6s cubic-bezier(.5,0,.9,.6),opacity .55s ease .15s}
.pc.fall.spin{animation:pcfall .7s ease-in forwards}
@keyframes pcfall{0%{transform:translate(-50%,-50%) scale(1) rotate(0)}25%{transform:translate(-50%,-50%) scale(1.25) rotate(40deg)}100%{transform:translate(-50%,-50%) scale(.2) rotate(420deg)}}
.ring{position:absolute;left:calc(var(--pad) + var(--c)*var(--step));top:calc(var(--pad) + var(--r)*var(--step));width:calc(var(--step)*.3);height:calc(var(--step)*.3);border-radius:50%;transform:translate(-50%,-50%) scale(.3);border:3px solid var(--cpu);opacity:.9;pointer-events:none;z-index:5;animation:ringout .6s ease-out forwards}
.ring.s0{border-color:var(--me)}.ring.big{border-width:5px;animation-duration:.8s}
@keyframes ringout{to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pc.fall.spin,.ring{animation:none}}
.pc.last{outline:2px dashed var(--mute);outline-offset:4px}
.pc[disabled]{opacity:1;cursor:default}
.pc.can{cursor:pointer}
.mk{position:absolute;transform:translate(-50%,-50%);left:calc(var(--pad) + var(--c)*var(--step));top:calc(var(--pad) + var(--r)*var(--step));width:calc(var(--step)*.9);height:calc(var(--step)*.9);padding:0;background:transparent;border-radius:50%;z-index:3}
.mk::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.mk.dot::after{width:calc(var(--step)*.2);height:calc(var(--step)*.2);background:var(--mk)}
.mk.push::after{width:calc(var(--step)*.82);height:calc(var(--step)*.82);border:3px solid var(--push);background:transparent}
.mk.push{z-index:5}
.mk.dot:hover::after{background:var(--ink)}
.legend-ico{position:relative;width:48px;height:48px;border-radius:12px;background:var(--chip);flex:none}
.legend-ico i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:var(--me)}
.irow{display:flex;align-items:center;gap:12px}.irow>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.irow b{font-size:14px}.irow span{font-size:12px;color:var(--mute);line-height:1.5}
.logbox{flex:1 1 0;min-height:120px}
.log{display:flex;flex-direction:column;gap:9px;overflow:auto;font-size:12px;line-height:1.5;max-height:340px}
.log div{display:flex;gap:10px;align-items:flex-start}.log .dot{margin-top:4px}
/* 重ね表示 */
.overlay{position:fixed;inset:0;z-index:50;background:var(--ovl);display:flex;align-items:center;justify-content:center;padding:16px}
.result-card{width:min(460px,100%)}
.rules-card{width:min(940px,100%);height:min(86vh,720px);padding:20px 22px;gap:10px}
.rules-head{display:flex;align-items:center;justify-content:space-between}
button.x{width:30px;height:30px;padding:0;border-radius:50%;font-size:14px}
.rules-layout{display:flex;gap:16px;flex:1;min-height:0}
.rules-nav{width:170px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:auto}
.rules-nav button{text-align:left;border-radius:10px;background:transparent;font-weight:500}
.rules-nav button.on{background:var(--acc);color:var(--accfg);font-weight:700}
.rules-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rules-body{flex:1;overflow:auto;font-size:13px;line-height:1.8;padding-right:6px}
.rules-body h3{margin:0 0 6px;font-size:18px}.rules-body h4{margin:14px 0 4px;font-size:14px}
.rules-body p{margin:4px 0}.rules-body ul,.rules-body ol{margin:4px 0;padding-left:20px}
.rules-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.gnote{background:var(--chip);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:12px}
.dgs{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
.dg{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px;color:var(--mute)}
.dgb{position:relative;background:var(--boardbg);border-radius:10px}
.dgb .ln{background:var(--grid)}
.dgp{position:absolute;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(24,26,32,.3)}
.dgp.s0{background:var(--me)}.dgp.s1{background:var(--cpu)}
.dgm{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--mk)}
.dgx{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:11px}
.leg{display:flex;flex-direction:column;gap:12px;margin:10px 0}.leg>div{display:flex;align-items:center;gap:12px}
.rtitle.win{color:#16a34a}.rtitle.lose{color:#bf5a55}
.result-players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.result-players li{display:flex;align-items:center;gap:8px;font-size:13px}.result-players .nm{flex:1;font-weight:700}
#snd{position:fixed;right:12px;bottom:56px;z-index:40;box-shadow:var(--shadow2);background:var(--panel)}
#theme{position:fixed;right:12px;bottom:12px;z-index:40;box-shadow:var(--shadow2);background:var(--panel)}
@media (max-width:1100px){
 :root{--step:clamp(34px,calc((100vw - 90px)/6.4),84px)}
 .body{flex-wrap:wrap}.left,.right{width:100%}.mapcol{order:-1;flex:1 1 100%;padding-top:44px}
 .hint{max-width:100%}.rules-layout{flex-direction:column}.rules-nav{width:auto;flex-direction:row;flex-wrap:wrap}
}
</style>
</head>
<body>
<main class="center" id="top" hidden></main>
<main class="center" id="lobby" hidden></main>
<main id="game" hidden>
  <header class="bar" id="bar"></header>
  <div class="body">
    <aside class="left" id="left"></aside>
    <section class="mapcol"><div class="hint" id="hint" aria-live="polite"></div>
      <div class="mid">
        <div class="bar2" id="bar-top"></div>
        <div class="bwrap"><div class="board" id="board"></div></div>
        <div class="bar2" id="bar-bot"></div>
      </div></section>
    <aside class="right" id="right"></aside>
  </div>
</main>
<div class="overlay" id="rules" role="dialog" aria-modal="true" aria-label="ルール" hidden></div>
<div class="overlay" id="result" role="dialog" aria-modal="true" aria-label="結果" hidden></div>
<button type="button" id="snd" data-act="snd"></button>
<button type="button" id="theme" data-act="theme"></button>
<script>
const Engine = (function () {
  const N = 6, SZ = 36, WIN = 100000;
  // コード: 0=空 / 側0（あなた・青）: 1小 3大 / 側1（CPU・橙）: 4小 6大（2・5は使わない）
  const side = function (c) { return c >= 4 ? 1 : 0; };
  const kind = function (c) { return (c - 1) % 3; };      // 0小 1中 2大
  const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  const DEFAULT_LAYOUT = [[0, 2, 1], [0, 5, 1], [1, 3, 1], [1, 4, 2], [2, 4, 1], [3, 5, 1]];   // [行, 列, 1小/2大]（上側）
  function initBoard() {
    const b = new Int8Array(SZ);
    // 上（側1・CPU）を基準に、下（側0・あなた）は180度回転した配置
    const top = RULE.layout || DEFAULT_LAYOUT;
    top.forEach(function (p) {
      const r = p[0], c = p[1], dai = p[2] === 2;
      b[r * N + c] = dai ? 6 : 4;
      b[(N - 1 - r) * N + (N - 1 - c)] = dai ? 3 : 1;
    });
    // 試験用：駒を増やす（extra=1：+1枚ずつ、2：+2枚ずつ）
    const ex = [[0, 3, 5, 2], [1, 5, 4, 0]];
    for (let q = 0; q < RULE.extra && q < ex.length; q++) { b[ex[q][0] * N + ex[q][1]] = 4; b[ex[q][2] * N + ex[q][3]] = 1; }
    return b;
  }

  const EXPERT_MS = { v: 1200 };
  const RULE = { ge: false, extra: 0, daiJoin: false, geDai: true, ownDai: true, layout: null, repMat: true };   // true：枚数が同じでも押せる（試験用）
  // 外周が落ちる仕組み：落ちたマス（hole）は盤の外と同じ扱い。pend＝次に落ちるマス、dropIn＝あと何手で落ちるか
  const ST = { hole: new Uint8Array(SZ), pend: new Uint8Array(SZ), dropIn: 99, nh: 0 };
  function inb(r, c) { return r >= 0 && r < N && c >= 0 && c < N && !ST.hole[r * N + c]; }
  function setState(hole, pend, dropIn) { ST.hole = hole; ST.pend = pend; ST.dropIn = dropIn; let n = 0; for (let i = 0; i < SZ; i++) n += hole[i]; ST.nh = n; }
  // 外周20マスを、180度回転で対応する2マスずつの10組にして、ランダムな順に並べる
  function dropPairs() {
    const seen = {}, pairs = [];
    for (let i = 0; i < SZ; i++) {
      const r = (i / N) | 0, c = i % N;
      if (r !== 0 && r !== N - 1 && c !== 0 && c !== N - 1) continue;
      if (seen[i]) continue;
      const j = SZ - 1 - i; seen[i] = seen[j] = 1; pairs.push([i, j]);
    }
    for (let i = pairs.length - 1; i > 0; i--) { const k = (Math.random() * (i + 1)) | 0, t = pairs[i]; pairs[i] = pairs[k]; pairs[k] = t; }
    return pairs;
  }

  // 合法手：{f:選んだ列の一番後ろ, n:選んだ枚数, d:向き, t:列の前のマス（押すときは押される連なりの先頭）, push:押される連なりの数（0なら1歩動くだけ）}
  // 選べるのは、隣り合って一直線に並んだ味方の小（1枚〜複数枚）。選んだ枚数が、押される連なりの数より多いときだけ押せる
  function gen(b, s) {
    const out = [];

    var conn = peer.connect(P2P.prefix + code, { reliable: true, serialization: 'json' });
    setupConn(conn);
    setTimeout(function () { if (NET.peer === peer && NET.status === 'connecting') netFail('部屋に接続できませんでした。もう一度お試しください'); }, 15000);
  }
  function setupConn(conn) {
    NET.conn = conn;
    conn.on('open', function () { if (NET.conn !== conn) return; NET.status = 'connected'; NET.gone = false; conn.send({ t: 'hello', name: pname() }); if (VIEW === 'lobby') renderLobby(); });
    conn.on('data', function (d) { if (NET.conn === conn) onNet(d); });
    conn.on('close', function () { if (NET.conn === conn) onGone(); });
    conn.on('error', function () { if (NET.conn === conn) onGone(); });
  }
  function onGone() {
    NET.conn = null; NET.oppName = ''; NET.gone = true;
    if (S && S.online && !S.over) { finishGame(0, '相手との接続が切れました（あなたの勝ちとして扱います）'); render(); return; }
    if (S && S.online) { render(); return; }
    if (NET.role === 'host') { NET.status = 'waiting'; NET.gone = false; if (VIEW === 'lobby') renderLobby(); }
    else netFail('ホストとの接続が切れました');
  }
  function hostStart(firstTime) {
    if (NET.role !== 'host' || !NET.conn || !NET.conn.open) return;
    if (!firstTime) NET.hostFirst = !NET.hostFirst; else NET.hostFirst = SET.playerFirst;
    var pairs = E.dropPairs();
    NET.myRe = NET.oppRe = false;
    netSend({ t: 'start', pairs: pairs, guestFirst: !NET.hostFirst });
    $('result').hidden = true; show('game'); newGame({ online: true, first: NET.hostFirst ? 0 : 1, pairs: pairs });
  }
  function onNet(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') { NET.oppName = String(d.name || '').slice(0, 12) || '相手'; if (VIEW === 'lobby') renderLobby(); else if (S && S.online) render(); }
    else if (d.t === 'full') { netFail('この部屋はすでに埋まっています'); }
    else if (d.t === 'bye') { onGone(); }
    else if (d.t === 'start' && NET.role === 'guest' && Array.isArray(d.pairs)) {
      var pairs = d.pairs.map(function (p) { return [SZ - 1 - p[0], SZ - 1 - p[1]]; });
      NET.myRe = NET.oppRe = false;
      $('result').hidden = true; show('game'); newGame({ online: true, first: d.guestFirst ? 0 : 1, pairs: pairs });
    }
    else if (d.t === 'timeout' && S && S.online && !S.over && S.turn === 1) { finishGame(0, '相手の持ち時間（2分）が切れました'); render(); }
    else if (d.t === 'rematch') { NET.oppRe = true; if (NET.role === 'host' && NET.myRe) hostStart(false); else if (S && S.online) render(); }
    else if (d.t === 'move' && S && S.online && !S.over && S.turn === 1 && d.m) {
      var r = rotM(d.m);
      var m = E.gen(S.b, 1).filter(function (x) { return x.f === r.f && x.n === r.n && x.d === r.d && x.t === r.t && x.push === r.push; })[0];
      if (!m) { S.msg = '相手の手を正しく受け取れませんでした（同期のずれ）。退室して、部屋を作り直してください'; render(); return; }
      doMove(m);
    }
  }
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'in-name') SET.name = e.target.value.trim().slice(0, 12);
    else if (id === 'in-color') { var hx = normHex(e.target.value); if (hx) { SET.color = hx; $('in-hex').value = hx; saveColorPrefs(); colorNote(); } }
    else if (id === 'in-ccolor') { var cx = normHex(e.target.value); if (cx) { SET.ccolor = cx; $('in-chex').value = cx; saveColorPrefs(); colorNote(); } }
    else if (id === 'in-chex') { var c2 = normHex(e.target.value); if (c2) { SET.ccolor = c2; $('in-ccolor').value = c2; saveColorPrefs(); colorNote(); } else { var nt2 = $('ccnote'); if (nt2) nt2.textContent = 'カラーコードは、#f2623f のような6桁（または3桁）で入れてください。'; } }
    else if (id === 'in-hex') { var h2 = normHex(e.target.value); if (h2) { SET.color = h2; $('in-color').value = h2; saveColorPrefs(); colorNote(); } else { var nt = $('cnote'); if (nt) nt.textContent = 'カラーコードは、#2457f5 のような6桁（または3桁）で入れてください。'; } }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOverlays(); });
  document.addEventListener('mouseover', function (e) { var mk = e.target.closest && e.target.closest('.mk'); if (mk) showPreview(mk); });
  document.addEventListener('mouseout', function (e) { var mk = e.target.closest && e.target.closest('.mk'); if (mk) clearPreview(); });
  document.addEventListener('focusin', function (e) { var mk = e.target.closest && e.target.closest('.mk'); if (mk) showPreview(mk); });
  document.addEventListener('focusout', function (e) { var mk = e.target.closest && e.target.closest('.mk'); if (mk) clearPreview(); });
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.id === 'rules') { closeOverlays(); return; }
    var mk = t.closest ? t.closest('.mk') : null; if (mk) { onMarker(mk); return; }
    var pc = t.closest ? t.closest('.pc') : null; if (pc) { if (SUPP) { SUPP = false; return; } onPiece(pc); return; }
    var rp = t.closest ? t.closest('[data-rp]') : null;
    if (rp) { RP = +rp.getAttribute('data-rp'); renderRules(); return; }
    var sb = t.closest ? t.closest('[data-set]') : null;
    if (sb) {
      var k = sb.getAttribute('data-set'), v = sb.getAttribute('data-val');
      if (k === 'level') SET.level = v; if (k === 'first') SET.playerFirst = v === '1';
      if (k === 'wlevel') SET.wLevel = v; if (k === 'nlevel') SET.nLevel = v; if (k === 'speed') SET.speed = v;
      renderLobby(); return;
    }
    var ab = t.closest ? t.closest('[data-act]') : null;
    if (!ab || ab.disabled) return;
    switch (ab.getAttribute('data-act')) {
      case 'tutorial': startTutorial(); break;
      case 'tut-prev': if (S.tut && S.tut.i > 0) tutLoad(S.tut.i - 1); break;
      case 'tut-next': if (S.tut && S.tut.i < TUT.length - 1) tutLoad(S.tut.i + 1); break;
      case 'tut-retry': if (S.tut) tutLoad(S.tut.i === TUT.length - 1 ? 0 : S.tut.i); break;
      case 'tut-drop': if (S.tut && !S.tut.done) { doDrop(0); S.tut.done = true; S.animMs = 380; render(); } break;
      case 'tut-play': SET.mode = 'cpu'; show('game'); newGame(); break;
      case 'tut-quit': if (S) S.gen = ++GEN; S = null; SET.mode = 'cpu'; show('top'); renderTop(); break;
      case 'create': netHost(); break;
      case 'join': netJoin(($('in-code').value || '').trim().toUpperCase()); break;
      case 'copy': try { navigator.clipboard.writeText($('invite-url').value); ab.textContent = 'コピーしました'; } catch (e6) { $('invite-url').select(); } break;
      case 'net-start': if (NET.role === 'host' && NET.status === 'connected') hostStart(true); break;
      case 'leave': netLeave(); break;
      case 'leave-game': netLeave(); break;
      case 'cpu': SET.mode = 'cpu'; show('lobby'); renderLobby(); break;
      case 'watch': SET.mode = 'watch'; show('lobby'); renderLobby(); break;
      case 'back': SET.mode = 'cpu'; show('top'); renderTop(); break;
      case 'start': show('game'); newGame(); break;
      case 'new': if (S && S.online) { if (S.over && !NET.myRe && !NET.gone) { NET.myRe = true; netSend({ t: 'rematch' }); if (NET.role === 'host' && NET.oppRe) hostStart(false); else render(); } break; } $('result').hidden = true; newGame(); break;
      case 'lobby': if (S && S.online) { netLeave(); break; } if (S) S.gen = ++GEN; $('result').hidden = true; show('lobby'); renderLobby(); break;
      case 'view': S.viewing = true; render(); break;
      case 'undo': S.sel = null; S.msg = ''; render(); break;
      case 'pause': S.paused = !S.paused; render(); break;
      case 'speed': SET.speed = ab.getAttribute('data-val'); render(); break;
      case 'rules': RP = 0; renderRules(); break;
      case 'close-rules': closeOverlays(); break;
      case 'rp-prev': RP--; renderRules(); break;
      case 'rp-next': RP++; renderRules(); break;
      case 'save-color': if (SET.color && PALETTE.indexOf(SET.color) < 0) { PALETTE.push(SET.color); if (PALETTE.length > 8) PALETTE.shift(); } saveColorPrefs(); renderLobby(); break;
      case 'save-ccolor': if (SET.ccolor && PALETTE.indexOf(SET.ccolor) < 0) { PALETTE.push(SET.ccolor); if (PALETTE.length > 8) PALETTE.shift(); } saveColorPrefs(); renderLobby(); break;
      case 'reset-ccolor': SET.ccolor = ''; saveColorPrefs(); renderLobby(); break;
      case 'pick-ccolor': SET.ccolor = ab.getAttribute('data-hex'); saveColorPrefs(); renderLobby(); break;
      case 'reset-color': SET.color = ''; saveColorPrefs(); renderLobby(); break;
      case 'pick-color': SET.color = ab.getAttribute('data-hex'); saveColorPrefs(); renderLobby(); break;
      case 'del-color': PALETTE = PALETTE.filter(function (x) { return x !== ab.getAttribute('data-hex'); }); saveColorPrefs(); renderLobby(); break;
      case 'snd': MUTED = !MUTED; try { localStorage.setItem('oshi-mute', MUTED ? '1' : '0'); } catch (e3) {} applySnd(); if (!MUTED) sfx('select'); break;
      case 'theme': var nt = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(nt); try { localStorage.setItem('oshi-theme', nt); } catch (e2) {} break;
    }
  });
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); $('theme').textContent = t === 'dark' ? '☀ ライトモード' : '🌙 ダークモード'; applyColor(); colorNote(); }
  var th = ''; try { th = localStorage.getItem('oshi-theme') || ''; } catch (e) { th = ''; }
  if (th !== 'dark' && th !== 'light') th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  try { var sc = normHex(localStorage.getItem('oshi-color')); SET.color = sc || ''; SET.ccolor = normHex(localStorage.getItem('oshi-ccolor')) || ''; PALETTE = JSON.parse(localStorage.getItem('oshi-palette') || '[]').map(normHex).filter(Boolean).slice(0, 8); } catch (e5) { PALETTE = []; }
  window.addEventListener('pagehide', function () { try { if (NET.conn && NET.conn.open) NET.conn.send({ t: 'bye' }); } catch (e) {} });
  applyTheme(th); applySnd();
  show('top'); renderTop();
  window.__oshi = { NET: NET, tut: startTutorial, get S() { return S; }, SET: SET, newGame: newGame, show: show, buildBoard: buildBoard, render: render };
})();
