/** card（カード）または図形名を受け取る */
function cardIcon(c) {
  const key = typeof c === 'string' ? c : c.type === 'food' ? FOOD_ICON[c.name] || 'potato' : c.type;
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${ICONS[key]}</svg>`;
}
function cardEffect(type) {
  const d = CONFIG.cards[type];
  if (d.kind === 'fuel') {
    const cond = d.minFire === 0 ? 'いつでも' : `火力${d.minFire}以上`;
    return `+${d.power}${d.smolder ? ' くすぶり' : ''}<br>${cond}`;
  }
  if (type === 'snow') return '鍋を始める';
  if (type === 'food') return '鍋に入れる';
  return `体温+${CONFIG.soupHeal}`;
}

/* ---------- 焚き火と鍋（SVG） ---------- */
function hearthSVG(anim) {
  const f = V.fire;
  const cx = 78, base = 104;
  let flames = '';
  if (f === 0) {
    flames = `<circle cx="${cx}" cy="${base - 6}" r="6" fill="#5b6478"/>`;
  } else {
    const H = 18 + f * 7;
    const spread = Math.min(8, 48 / f);
    const back = [], front = [];
    for (let j = 0; j < f; j++) {
      const off = (j - (f - 1) / 2) * spread;
      const h = H * (1 - 0.5 * Math.abs(off) / 40);
      const w = 16 + f * 1.4;
      back.push(`<polygon points="${cx + off - w / 2},${base} ${cx + off},${base - h} ${cx + off + w / 2},${base}" fill="#ff7a1a" opacity=".55"/>`);
    }
    const k = Math.ceil(f / 2);
    for (let j = 0; j < k; j++) {
      const off = (j - (k - 1) / 2) * spread * 1.1;
      const h = H * 0.58 * (1 - 0.5 * Math.abs(off) / 40);
      const w = 10 + f;
      front.push(`<polygon points="${cx + off - w / 2},${base} ${cx + off},${base - h} ${cx + off + w / 2},${base}" fill="#ffb347" opacity=".95"/>`);
    }
    flames = back.join('') + front.join('');
  }
  const flameCls = anim ? `flames ${anim}` : 'flames';
  const logs = `<line x1="${cx - 28}" y1="${base + 7}" x2="${cx + 28}" y2="${base - 1}" stroke="#6b4a30" stroke-width="7" stroke-linecap="round"/>
    <line x1="${cx - 28}" y1="${base - 1}" x2="${cx + 28}" y2="${base + 7}" stroke="#7d5636" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${cx + 29}" cy="${base + 7}" r="3.5" fill="#dcae74"/><circle cx="${cx - 29}" cy="${base + 7}" r="3.5" fill="#dcae74"/>
    ${[-20, -8, 6, 18].map((d, i) => `<circle cx="${cx + d}" cy="${base + 10 + (i % 2)}" r="1.6" fill="#5b6478"/>`).join('')}`;
  let smolder = '';
  for (let i = 0; i < V.smolder; i++) {
    smolder += `<circle cx="${cx + 34 + i * 8}" cy="${base - 4}" r="3" fill="none" stroke="#7fb8ff" stroke-width="1.5"/>`;
  }
  const fireText = `<text x="${cx}" y="${base + 30}" text-anchor="middle" fill="#f2efe6" font-size="15" font-weight="700">火力 ${f}</text>` +
    (V.smolder ? `<text x="${cx}" y="${base + 45}" text-anchor="middle" fill="#7fb8ff" font-size="10">くすぶり ${V.smolder}</text>` : '');

  // 鍋
  const px = 162, py = 82, r = 28;
  let pot;
  if (V.pot) {
    const C = CONFIG.stew.doneStage;
    let marks = '';
    const ms = V.pot.markers;
    ms.forEach((m, i) => {
      const row = Math.floor(i / 5), col = i % 5, inRow = Math.min(5, ms.length - row * 5);
      const mx = px + (col - (inRow - 1) / 2) * 10;
      const my = py + 7 + row * 9;
      marks += `<circle cx="${mx}" cy="${my}" r="4" fill="${V.players[m.seat].color}" stroke="#0f1626" stroke-width="1"/>`;
    });
    let prog = '';
    for (let i = 0; i < C; i++) {
      prog += `<rect x="${px - (C * 12 - 4) / 2 + i * 12}" y="${py + r + 8}" width="8" height="8" fill="${i < V.pot.stage ? '#ffb347' : 'none'}" stroke="#ffb347" stroke-width="1"/>`;
    }
    const steam = V.pot.stage > 0 ? `<path d="M${px - 9},${py - 4} c-3,-5 3,-7 0,-13 M${px},${py - 4} c-3,-6 3,-8 0,-15 M${px + 9},${py - 4} c-3,-5 3,-7 0,-13" stroke="#f2efe6" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".55"/>` : '';
    pot = `${steam}<path d="M${px - r - 7},${py + 3} a4,4 0 0 1 7,-3 M${px + r + 7},${py + 3} a4,4 0 0 0 -7,-3" stroke="#f2efe6" stroke-width="1.5" fill="none"/>
      <path d="M${px - r},${py} A${r},${r} 0 0 0 ${px + r},${py} Z" fill="#1c2740" stroke="#f2efe6" stroke-width="1.5"/>
      <line x1="${px - r - 3}" y1="${py}" x2="${px + r + 3}" y2="${py}" stroke="#f2efe6" stroke-width="2"/>
      ${marks}${prog}
      <text x="${px}" y="${py + r + 30}" text-anchor="middle" fill="#f2efe6" font-size="10">煮込み ${V.pot.stage}/${C}</text>`;
  } else {
    pot = `<path d="M${px - r},${py} A${r},${r} 0 0 0 ${px + r},${py} Z" fill="none" stroke="#5d6782" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${px}" y="${py + r + 18}" text-anchor="middle" fill="#5d6782" font-size="10">鍋なし</text>`;
  }
  return `<svg viewBox="28 6 170 154" role="img" aria-label="焚き火 火力${f}${V.pot ? '、鍋 煮込み' + V.pot.stage : ''}">
    ${logs}<g class="${flameCls}">${flames}</g>${smolder}${fireText}${pot}</svg>`;
}

/* ---------- 席（自分の席がいつも手前に来るよう回す） ---------- */
function buildSeats(n) {
  const table = $('table');
  ui.seatEls.forEach(el => el.remove());
  ui.seatEls = [];
  for (let seat = 0; seat < n; seat++) {
    const el = document.createElement('div');
    el.className = 'seat';
    const pos = (seat - ui.mySeat + n) % n;
    const ang = (90 + pos * 360 / n) * Math.PI / 180;
    el.style.left = (50 + 36 * Math.cos(ang)) + '%';
    el.style.top = (50 + 39 * Math.sin(ang)) + '%';
    table.appendChild(el);
    ui.seatEls.push(el);
  }
}
function retrigger(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

/* ---------- 見える情報だけの状態（ビュー） ---------- */
const visibleLog = (log, seat) => log.filter(e => e.to === undefined || e.to === seat);
function waitingSeat() { return ui.human ? ui.mySeat : ui.remoteWait ? ui.remoteWait.seat : -1; }
/** 席 seat の人に見せてよい情報だけを取り出す（他人の手札・山札の順番・CPUの性格は含めない） */
function viewOf(s, seat) {
  const reveal = !!(M && M.done);
  return {
    n: s.n, rounds: s.rounds, round: s.round, startSeat: s.startSeat, turnSeat: s.turnSeat,
    fire: s.fire, smolder: s.smolder, over: s.over, endReason: s.endReason,
    pot: s.pot && { stage: s.pot.stage, markers: s.pot.markers.map(m => ({ seat: m.seat })) },
    deckCount: s.deck.length, discardCount: s.discard.length,
    chillLeft: s.chillDeck.map(c => c.id).sort(),
    players: s.players.map(p => ({
      seat: p.seat, name: p.name, isHuman: p.isHuman, away: p.away, color: p.color,
      temp: p.temp, alive: p.alive, deathOrder: p.deathOrder, deathRound: p.deathRound,
      handCount: p.hand.length,
      hand: p.seat === seat ? p.hand.map(c => ({ ...c })) : null,
      personality: reveal ? p.personality : null,
    })),
    waitingSeat: waitingSeat(),
    match: M && { nights: M.nights, night: M.night, results: M.results },
  };
}
function matchTotalsOf(match, n) {
  return Array.from({ length: n }, (_, seat) => match.results.reduce((a, r) => a + r.points[seat], 0));
}
function canAct() {
  if (!V || V.over || V.waitingSeat !== ui.mySeat || !V.players[ui.mySeat].alive) return false;
  return Net.role === 'guest' ? !ui.sent : !!ui.human;
}

/* ---------- 描画 ---------- */
/** エンジンの状態からビューを作って描く。ホストは参加者にも配る。 */
function render() {
  if (S) {
    V = viewOf(S, ui.mySeat);
    V.log = visibleLog(S.log, ui.mySeat);
    if (Net.role === 'host') Net.broadcastState();
  }
  if (V) draw();
}

function draw() {
  const prev = ui.prev;

  // 情報バー
  $('info-night').hidden = !(V.match && V.match.nights > 1);
  if (V.match) $('info-night').textContent = `第${V.match.night}夜 / ${V.match.nights}`;
  $('info-round').textContent = `${V.round} / ${V.rounds}`;
  $('info-chill').innerHTML = CONFIG.chill.map(ch => {
    const k = V.chillLeft.filter(id => id === ch.id).length;
    return `<span><i class="${ch.id}"></i>${ch.name} ${k}</span>`;
  }).join('');
  $('info-deck').textContent = V.deckCount;
  $('info-discard').textContent = `捨て札 ${V.discardCount}`;

  // 焚き火
  const newlyDead = prev ? V.players.filter(p => !p.alive && prev.alive[p.seat]) : [];
  let anim = '';
  if (prev && V.fire !== prev.fire) anim = newlyDead.length && V.fire > prev.fire ? 'burst' : V.fire > prev.fire ? 'up' : 'down';
  $('hearth').innerHTML = hearthSVG(anim);

  // 席（3夜制の2夜目以降は累計点も）
  const totals = V.match && V.match.results.length ? matchTotalsOf(V.match, V.n) : null;
  for (const p of V.players) {
    const el = ui.seatEls[p.seat];
    let bar = '';
    for (let i = 1; i <= CONFIG.temp.max; i++) bar += `<i class="${i <= p.temp ? 'on' : ''}"></i>`;
    const tag = !p.alive ? '<span>凍死</span>'
      : V.startSeat === p.seat && !V.over ? '<span class="badge">スタート</span>'
      : p.away ? '<span class="away">切断</span>' : '';
    el.innerHTML = `
      <div class="head"><i class="dot" style="background:${p.color}"></i><span class="nm">${esc(p.name)}</span>${totals ? `<span class="pts"><span class="lbl">計</span>${totals[p.seat]}点</span>` : ''}</div>
      <div class="temp"><div class="tbar" aria-hidden="true">${bar}</div><span class="tnum" aria-label="体温">${p.temp}</span></div>
      <div class="sub"><span>手札 ${p.handCount}</span>${tag}</div>`;
    el.classList.toggle('active', V.turnSeat === p.seat && p.alive);
    el.classList.toggle('dead', !p.alive);
    el.classList.toggle('cold', p.alive && p.temp <= CONFIG.ai.dangerTemp);
    if (prev) {
      if (!p.alive && prev.alive[p.seat]) { retrigger(el, 'flash'); Sound.play('freeze'); Sound.play('relic'); }
      else if (p.temp < prev.temps[p.seat]) retrigger(el, 'hit-cold');
      else if (p.temp > prev.temps[p.seat]) retrigger(el, 'hit-warm');
    }
  }

  renderStatus();
  renderHand();
  renderLog();

  ui.prev = { fire: V.fire, temps: V.players.map(p => p.temp), alive: V.players.map(p => p.alive) };
}

function renderStatus() {
  const st = $('status');
  if (V.over) { st.textContent = V.endReason === 'dawn' ? '夜が明けた。' : '焚き火は静かに燃えている…'; return; }
  if (V.turnSeat < 0) { st.textContent = 'ラウンド終了'; return; }
  const p = V.players[V.turnSeat];
  if (p.seat === ui.mySeat) {
    if (canAct()) st.innerHTML = ui.pickStoke ? '<span class="you">くべる燃料を選んでください</span>' : '<span class="you">あなたの番です。</span>行動を1つ選んでください。';
    else st.textContent = ui.sent ? '送信しました…' : 'あなたの番です';
  } else if (p.isHuman && !p.away) {
    st.textContent = `${p.name} の番です（考え中…）`;
  } else {
    st.textContent = `${p.name} が考えている…`;
  }
  // 人間が全員凍死したら早送りできる（参加者はホストに合わせる）
  const humansAlive = V.players.some(q => q.isHuman && !q.away && q.alive);
  if (!humansAlive && !ui.ff && Net.role !== 'guest') {
    st.innerHTML += ' <button type="button" id="btn-ff" style="margin-left:8px;padding:4px 10px;font-size:12px">結果まで早送り</button>';
    $('btn-ff').onclick = () => { ui.ff = true; render(); };
  }
}

function renderHand() {
  const me = V.players[ui.mySeat];
  const myTurn = canAct();
  const la = legalActions(V, ui.mySeat);
  const hand = $('hand');
  $('hand-count').textContent = me.alive ? `${me.hand.length}枚` : '';

  if (!me.alive) {
    hand.innerHTML = '<span class="empty">あなたは凍死した。夜明けまで見届けよう。</span>';
  } else if (!me.hand.length) {
    hand.innerHTML = '<span class="empty">手札はありません</span>';
  } else {
    const order = t => CONFIG.handOrder.indexOf(t);
    const cards = me.hand.slice().sort((a, b) => order(a.type) - order(b.type) || a.id - b.id);
    hand.innerHTML = '';
    for (const c of cards) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      const fuel = isFuel(c);
      if (fuel && !canStoke(V, c)) b.classList.add('unplayable');
      if (ui.selected === c.id) b.classList.add('selected');
      if (myTurn && ui.pickStoke && fuel && canStoke(V, c)) b.classList.add('pickable');
      b.disabled = !myTurn;
      b.innerHTML = `${cardIcon(c)}<span class="cn">${cardName(c)}</span><span class="ce">${cardEffect(c.type)}</span>`;
      b.title = `${cardName(c)}：${cardEffect(c.type).replace('<br>', '／')}`;
      b.onclick = () => onCardClick(c);
      hand.appendChild(b);
    }
  }

  // 行動ボタン
  const sel = ui.selected != null ? me.hand.find(c => c.id === ui.selected) : null;
  const selAct = sel ? actionForCard(sel) : null;
  const defs = [
    { id: 'stoke', label: 'くべる', ok: la.stoke.length > 0 },
    { id: 'warm', label: '暖まる', n: la.warm ? `+${la.warm}` : '', ok: la.warm > 0 },
    { id: 'gather', label: '薪拾い', n: `−${CONFIG.gather.cost}`, ok: true },
    { id: 'startPot', label: '鍋を始める', ok: !!la.startPot },
    { id: 'addPot', label: '鍋に入れる', ok: !!la.addPot },
    { id: 'drink', label: 'スープを飲む', n: `+${CONFIG.soupHeal}`, ok: !!la.drink },
  ];
  const box = $('actions');
  box.innerHTML = '';
  for (const d of defs) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = d.id === 'warm' ? 'warm' : d.id === 'drink' ? 'drink' : d.id === 'gather' ? 'gather' : '';
    if (selAct === d.id && d.ok) b.classList.add('suggest');
    b.innerHTML = d.label + (d.n ? `<span class="n">${d.n}</span>` : '');
    b.disabled = !myTurn || !d.ok;
    b.onclick = () => onActionClick(d.id);
    box.appendChild(b);
  }
  $('hint').textContent = myTurn ? (ui.hint || 'カードを選ぶとできる行動が光ります（もう一度押すと実行）') : '';
}

function renderLog() {
  const ol = $('log');
  if (ui.logShown > V.log.length) { ol.innerHTML = ''; ui.logShown = 0; }
  for (; ui.logShown < V.log.length; ui.logShown++) {
    const e = V.log[ui.logShown];
    const li = document.createElement('li');
    li.textContent = e.text;
    if (e.cls) li.className = e.cls;
    ol.appendChild(li);
  }
  ol.scrollTop = ol.scrollHeight;
}
function resetBoard(n) {
  ui.prev = null;
  ui.logShown = 0;
  ui.selected = null;
  ui.pickStoke = false;
  ui.hint = '';
  $('log').innerHTML = '';
  hideChillCard();
  $('speed-in-game').value = ui.speed;
  $('speed-in-game').hidden = Net.role === 'guest';
  $('btn-quit').textContent = Net.role === 'host' ? '部屋を閉じる' : Net.role === 'guest' ? '退出' : 'やめる';
  buildSeats(n);
}

/* ---------- あなたの操作 ---------- */
function actionForCard(c) {
  if (isFuel(c)) return 'stoke';
  return { snow: 'startPot', food: 'addPot', soup: 'drink' }[c.type];
}
function cardActionLegal(c) {
  const la = legalActions(V, ui.mySeat);
  switch (actionForCard(c)) {
    case 'stoke': return canStoke(V, c) ? '' : `火力${CONFIG.cards[c.type].minFire}以上でないとくべられません`;
    case 'startPot': return la.startPot ? '' : 'すでに鍋が置かれています';
    case 'addPot': return la.addPot ? '' : '鍋が置かれていません';
    case 'drink': return '';
  }
  return '';
}
function submitHuman(action) {
  if (!canAct()) return;
  ui.selected = null;
  ui.pickStoke = false;
  ui.hint = '';
  if (Net.role === 'guest') {
    ui.sent = true;
    Net.send({ t: 'action', action });
    draw();
    return;
  }
  const h = ui.human;
  ui.human = null;
  h.resolve(action);
}
function cardToAction(c) {
  const t = actionForCard(c);
  return t === 'stoke' || t === 'addPot' ? { type: t, cardId: c.id } : { type: t };
}
function onCardClick(c) {
  if (!canAct()) return;
  const why = cardActionLegal(c);
  if (ui.pickStoke) {
    if (isFuel(c) && !why) return submitHuman(cardToAction(c));
    ui.hint = 'くべられる燃料を選んでください';
    return draw();
  }
  if (ui.selected === c.id) {
    if (!why) return submitHuman(cardToAction(c));
    ui.hint = why;
    return draw();
  }
  ui.selected = c.id;
  Sound.play('select');
  ui.hint = why || `${cardName(c)}：もう一度押すか、光っているボタンで実行`;
  draw();
}
function onActionClick(id) {
  if (!canAct()) return;
  const me = V.players[ui.mySeat];
  const la = legalActions(V, ui.mySeat);
  if (id === 'stoke') {
    const sel = me.hand.find(c => c.id === ui.selected);
    if (sel && isFuel(sel) && canStoke(V, sel)) return submitHuman({ type: 'stoke', cardId: sel.id });
    const types = [...new Set(la.stoke.map(c => c.type))];
    if (types.length === 1) return submitHuman({ type: 'stoke', cardId: la.stoke[0].id });
    ui.pickStoke = true;
    ui.selected = null;
    ui.hint = '';
    return draw();
  }
  if (id === 'addPot') {
    const sel = me.hand.find(c => c.id === ui.selected && c.type === 'food');
    return submitHuman({ type: 'addPot', cardId: (sel || la.addPot).id });
  }
  submitHuman({ type: id });
}
function awaitHuman() {
  return new Promise((resolve, reject) => {
    ui.human = { resolve, reject };
    ui.selected = null;
    ui.pickStoke = false;
    ui.hint = '';
    render();
    Sound.play('yourTurn');
  });
}
/** 参加者から届いた行動が正しいか（ホストで確認する） */
function isLegalAction(s, seat, a) {
  if (!a || typeof a !== 'object' || typeof a.type !== 'string') return false;
  const la = legalActions(s, seat);
  switch (a.type) {
    case 'stoke': return la.stoke.some(c => c.id === a.cardId);
    case 'warm': return la.warm > 0;
    case 'gather': return true;
    case 'startPot': return !!la.startPot;
    case 'addPot': return !!la.addPot && s.players[seat].hand.some(c => c.id === a.cardId && c.type === 'food');
    case 'drink': return !!la.drink;
  }
  return false;
}
function awaitPlayer(seat) {
  return seat === ui.mySeat ? awaitHuman() : Net.awaitRemote(seat);
}
function abortWaits() {
  ui.gen++;
  if (ui.human) { ui.human.reject(ABORT); ui.human = null; }
  if (ui.remoteWait) { ui.remoteWait.reject(ABORT); ui.remoteWait = null; }
}

/* ---------- 冷え込みの演出 ---------- */
function showChillCard(info) {
  const el = $('chill-card');
  const { card, radiant, value } = info;
  el.innerHTML = `<div class="face">
    <div class="lbl">冷え込み</div>
    <svg class="ico" viewBox="0 0 40 40" aria-hidden="true">${ICONS[card.id] || ''}</svg>
    <div class="name">${esc(card.name)}</div>
    <div class="val">${radiant ? `<s>−${card.value}</s>` : ''}体温 −${value}</div>
    ${radiant ? `<div class="note">輻射熱で ${CONFIG.radiant.reduce} 軽減</div>` : ''}
  </div>`;
  el.hidden = false;
}
function hideChillCard() {
  clearTimeout(ui.chillTimer);
  $('chill-card').hidden = true;
}
async function showChill(info) {
  const ms = Math.max(1000, speedMs() * 1.8);
  if (!ui.ff) Net.broadcast({ t: 'chill', info, ms });
  showChillCard(info);
  try {
    await wait(ms);
  } finally {
    hideChillCard();
  }
}
/** 効果音を鳴らし、オンラインなら参加者にも鳴らしてもらう */
function sfx(name, ...args) {
  Sound.play(name, ...args);
  if (!ui.ff) Net.broadcast({ t: 'sfx', name, args });
}

/* ---------- 進行（ひとり用とホストで動く） ---------- */
async function playGame() {
  render();
  await wait(500);
  for (;;) {
    for (let i = 0; i < S.n && !S.over; i++) {
      const seat = (S.startSeat + i) % S.n;
      const p = S.players[seat];
      if (!p.alive) continue;
      S.turnSeat = seat;
      render();
      let action;
      if (p.isHuman && !p.away) {
        action = await awaitPlayer(seat);
      } else {
        await wait(speedMs());
        action = cpuChoose(S, seat);
      }
      doAction(S, seat, action);
      sfx(action.type);
      render();
      if (S.over) break;
      if (p.alive) {
        await wait(Math.max(250, speedMs() * 0.5));
        const logLen = S.log.length;
        endTurn(S, seat);
        if (S.log.slice(logLen).some(e => e.cls === 'cold')) sfx('fizz');
        render();
      }
      if (!S.over) await wait(p.isHuman ? 300 : speedMs() * 0.3);
    }
    S.turnSeat = -1;
    if (S.over) break;

    // ラウンド終了処理
    render();
    const info = revealChill(S);
    sfx('chill', info.value);
    await showChill(info);
    applyChill(S, info);
    render();
    await wait(900);
    if (S.over) break;
    const hadPot = !!S.pot;
    if (stew(S)) {
      if (hadPot && !S.pot) sfx('potDone');
      render();
      await wait(600);
    }
    if (!nextRound(S)) break;
    render();
    await wait(500);
  }
  if (S.endReason === 'dawn') sfx('dawn');
  render();
  await wait(1200);
  endNight();
}

/* ---------- 3夜制 ---------- */
let M = null;

function startMatch() {
  const seed = ui.seedParam != null ? ui.seedParam : (Math.random() * 2 ** 32) >>> 0;
  ui.seedParam = null; // URL指定のシードは最初の1回だけ
  console.info('[焚き火の夜] seed =', seed);
  const rng = mulberry32(seed);
  const P = CONFIG.personalities;
  const defs = Net.role === 'host'
    ? Net.seatDefs()
    : Array.from({ length: ui.players }, (_, seat) => (seat === 0 ? { name: 'あなた' } : null));
  if (Net.role !== 'host') ui.mySeat = 0;
  M = {
    nights: ui.nights, night: 0, n: ui.players, defs, done: false,
    personalities: defs.map(d => (d ? null : P[Math.floor(rng() * P.length)])),
    seeds: Array.from({ length: ui.nights }, () => Math.floor(rng() * 2 ** 32)),
    results: [], // 夜ごとの { points: 席別得点, frozen: 席別の凍死 }
  };
  Sound.unlock();
  startNight();
}

function startNight() {
  abortWaits();
  M.night++;
  S = createGame(M.n, M.seeds[M.night - 1], { seats: M.defs, personalities: M.personalities });
  if (M.nights > 1) S.log.unshift({ text: `第${M.night}夜 / ${M.nights}`, cls: 'night' });
  ui.ff = false;
  if (Net.role === 'host') Net.newNight();
  resetBoard(S.n);
  showScreen('game');
  playGame().catch(e => { if (e !== ABORT) throw e; });
}

function quitGame() {
  abortWaits();
  S = null;
  V = null;
  M = null;
  showScreen('start');
}

function endNight() {
  M.results.push({
    points: S.players.map(p => (p.alive ? p.temp : CONFIG.match.frozenPoints)),
    frozen: S.players.map(p => !p.alive),
  });
  const kind = M.nights === 1 ? 'single' : M.night < M.nights ? 'interim' : 'final';
  if (kind !== 'interim') M.done = true; // 性格を公開してよい
  render();
  Net.broadcast({ t: 'screen', kind });
  showResultScreen(kind);
}

/* ---------- 結果 ---------- */
function showResultScreen(kind) {
  if (kind === 'single') showResult();
  else if (kind === 'interim') showInterim();
  else showFinal();
  setResultButtonsFor(kind);
  showScreen('result');
}
function setResultButtons(primary, primaryFn, secondary, secondaryFn) {
  $('btn-again').textContent = primary;
  $('btn-again').onclick = primaryFn;
  $('btn-again').disabled = !primaryFn;
  $('btn-title').textContent = secondary;
  $('btn-title').onclick = secondaryFn;
}
function setResultButtonsFor(kind) {
  if (Net.role === 'guest') return setResultButtons('ホスト待ち', null, '退出', () => Net.leave());
  const [s2, s2fn] = Net.role === 'host' ? ['部屋を閉じる', () => Net.leave()] : [kind === 'interim' ? 'やめる' : 'タイトルへ', quitGame];
  if (kind === 'interim') return setResultButtons(`第${M.night + 1}夜へ`, () => { Sound.unlock(); startNight(); }, s2, s2fn);
  setResultButtons(Net.role === 'host' ? '部屋に戻る' : 'もう一度', Net.role === 'host' ? () => Net.backToLobby() : startMatch, s2, s2fn);
}
const nameCell = p => `<td class="pl"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</td>`;
const winnerTitle = winners => (winners.some(p => p.seat === ui.mySeat)
  ? (winners.length > 1 ? 'あなたも勝利（同時勝利）' : 'あなたの勝ち')
  : winners.map(p => p.name).join('・') + (winners.length > 1 ? ' の同時勝利' : ' の勝ち'));
const persName = p => (p.personality ? p.personality.name + (p.isHuman ? '<small>切断後CPU</small>' : '') : '—');

/** 1夜だけのとき */
function showResult() {
  const rows = ranking(V);
  $('result-title').textContent = winnerTitle(rows.filter(r => r.win).map(r => r.p));
  $('result-lead').textContent = V.endReason === 'dawn'
    ? (aliveSeats(V).length ? '夜が明けた。いちばん暖かく朝を迎えた者が勝つ。' : '')
    : '夜明けを待たず、全員が凍えてしまった。最後まで耐えた者の勝ち。';
  $('result-head').innerHTML = '<tr><th>順位</th><th>プレイヤー</th><th>性格</th><th>最終体温</th></tr>';
  $('result-body').innerHTML = rows.map(({ p, rank, win }) => `
    <tr class="${win ? 'win' : ''}">
      <td class="r">${rank}</td>${nameCell(p)}
      <td>${persName(p)}</td>
      <td>${p.alive ? p.temp : `<span class="frozen">凍死（R${p.deathRound}）</span>`}</td>
    </tr>`).join('');
  $('result-note').textContent = '';
}

/** 夜と夜のあいだ（性格はまだ明かさない） */
function showInterim() {
  const match = V.match;
  const last = match.results[match.results.length - 1];
  const best = Math.max(...last.points);
  const tops = V.players.filter(p => p.alive && p.temp === best);
  $('result-title').textContent = `第${match.night}夜が明けた`;
  $('result-lead').textContent = V.endReason === 'dawn' && tops.length
    ? `この夜いちばん暖かかったのは ${tops.map(p => p.name).join('・')}（体温 ${best}）`
    : '夜明けを待たず、全員が凍えてしまった。この夜は全員0点。';
  $('result-head').innerHTML = `<tr><th>順位</th><th>プレイヤー</th><th class="n">第${match.night}夜</th><th class="n">累計</th></tr>`;
  $('result-body').innerHTML = rankByScore(matchTotalsOf(match, V.n)).map(({ seat, v, rank }) => {
    const p = V.players[seat];
    const pts = last.frozen[seat] ? `<span class="frozen">凍死 ${last.points[seat]}</span>` : last.points[seat];
    return `<tr class="${rank === 1 ? 'win' : ''}"><td class="r">${rank}</td>${nameCell(p)}<td class="n">${pts}</td><td class="n total">${v}</td></tr>`;
  }).join('');
  $('result-note').textContent = `夜明けの体温がその夜の得点（凍死は${CONFIG.match.frozenPoints}点）。残り ${match.nights - match.night} 夜。`;
}

/** 全夜の終わり */
function showFinal() {
  const match = V.match;
  const rows = rankByScore(matchTotalsOf(match, V.n));
  $('result-title').textContent = winnerTitle(rows.filter(r => r.rank === 1).map(r => V.players[r.seat]));
  $('result-lead').textContent = `${match.nights}夜の合計得点で勝敗が決まった。`;
  const nightHeads = match.results.map((_, k) => `<th class="n">${k + 1}夜</th>`).join('');
  $('result-head').innerHTML = `<tr><th>順位</th><th>プレイヤー</th><th>性格</th>${nightHeads}<th class="n">合計</th></tr>`;
  $('result-body').innerHTML = rows.map(({ seat, v, rank }) => {
    const p = V.players[seat];
    const cells = match.results.map(r => `<td class="n">${r.frozen[seat] ? `<span class="frozen">${r.points[seat]}</span>` : r.points[seat]}</td>`).join('');
    return `<tr class="${rank === 1 ? 'win' : ''}"><td class="r">${rank}</td>${nameCell(p)}<td>${persName(p)}</td>${cells}<td class="n total">${v}</td></tr>`;
  }).join('');
  $('result-note').textContent = '青い数字は凍死した夜';
}
/** 点数の高い順に並べ、同点は同順位 */
function rankByScore(scores) {
  const order = scores.map((v, seat) => ({ seat, v })).sort((a, b) => b.v - a.v || a.seat - b.seat);
  order.forEach((r, i) => { r.rank = i > 0 && order[i - 1].v === r.v ? order[i - 1].rank : i + 1; });
  return order;
}

/* ================================================================
 * オンライン対戦（WebRTC の P2P。接続の仲介に PeerJS の公開サーバーを使う）
 *  - 部屋を作った人（ホスト）のブラウザがゲームを進め、各参加者に見える情報だけを送る
 *  - 参加者は自分の行動をホストに送るだけ。ホストが正しい手か確かめてから受け付ける
 * ================================================================ */
const NET = Object.assign({
  peerjsSrc: 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
  peerOptions: {},          // 自前の PeerServer を使うときは { host, port, path, secure }
  idPrefix: 'takibi-no-yoru-v1-',
  codeChars: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',
  codeLength: 5,
  maxHumans: 5,
  joinTimeoutMs: 15000,
  pingMs: 3000,            // 生存確認の間隔
  dropMs: 20000,           // これだけ音沙汰がなければ切断とみなす（タブを閉じても通知が来ないことがあるため）
}, window.CAMPFIRE_NET || {}); // テスト用の上書き（URLからは変えられない）

function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = NET.peerjsSrc;
    el.onload = () => (window.Peer ? resolve() : reject(new Error('load')));
    el.onerror = () => reject(new Error('load'));
    document.head.appendChild(el);
  });
}
const cleanName = n => (String(n || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 8) || '旅人');
const cleanCode = c => String(c || '').toUpperCase().split('').filter(ch => NET.codeChars.includes(ch)).join('').slice(0, NET.codeLength);
function randomCode() {
  let c = '';
  for (let i = 0; i < NET.codeLength; i++) c += NET.codeChars[Math.floor(Math.random() * NET.codeChars.length)];
  return c;
}
function safeSend(conn, msg) {
  try { if (conn && conn.open) conn.send(msg); } catch (e) { /* 切断済み */ }
}

const Net = {
  role: null,       // null（ひとり用）| 'host' | 'guest'
  peer: null,
  code: '',
  name: '',
  started: false,
  members: [],      // ホスト：参加者 { conn, name, seat, sentLog, reset, left }
  conn: null,       // 参加者：ホストへの接続
  lobby: null,      // 参加者：最後に受け取った部屋の情報
  leaving: false,
  heartbeat: 0,
  lastSeen: 0,      // 参加者：ホストから最後に受信した時刻

  /* ---- 共通 ---- */
  active() { return this.members.filter(m => !m.left); },
  broadcast(msg) {
    if (this.role !== 'host') return;
    for (const m of this.active()) safeSend(m.conn, msg);
  },
  send(msg) { if (this.role === 'guest') safeSend(this.conn, msg); },
  reset() {
    this.leaving = true;
    clearInterval(this.heartbeat);
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* 無視 */ }
    Object.assign(this, { role: null, peer: null, code: '', started: false, members: [], conn: null, lobby: null, leaving: false, heartbeat: 0 });
  },
  /** 部屋から出る（ホストなら部屋を閉じる） */
  leave(message = '') {
    if (this.role === 'host') this.broadcast({ t: 'closed', reason: 'ホストが部屋を閉じました' });
    const finish = () => {
      this.reset();
      abortWaits();
      S = null; V = null; M = null;
      ui.mySeat = 0;
      showScreen('start');
      $('online-msg').textContent = message;
    };
    if (this.role === 'host') setTimeout(finish, 150); // closed を届けてから切る
    else finish();
  },

  /* ---- ホスト ---- */
  async host(name) {
    this.name = cleanName(name);
    await loadPeerJS();
    for (let attempt = 0; attempt < 4; attempt++) {
      const code = randomCode();
      try {
        await new Promise((resolve, reject) => {
          const peer = new window.Peer(NET.idPrefix + code, NET.peerOptions);
          peer.on('open', () => { this.peer = peer; resolve(); });
          peer.on('error', err => {
            if (this.peer !== peer) { peer.destroy(); reject(err); return; }
            if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
              $('lobby-msg').textContent = '接続サーバーとの通信が不安定です…';
            }
          });
        });
      } catch (err) {
        if (err.type === 'unavailable-id') continue; // コードが使用中なら作り直す
        throw err;
      }
      Object.assign(this, { role: 'host', code, started: false, members: [] });
      this.peer.on('disconnected', () => { if (!this.leaving && this.peer && !this.peer.destroyed) this.peer.reconnect(); });
      this.peer.on('connection', conn => this.onConnection(conn));
      this.heartbeat = setInterval(() => this.hostTick(), NET.pingMs);
      return;
    }
    throw new Error('code');
  },
  onConnection(conn) {
    conn.on('open', () => {
      const reject = reason => { safeSend(conn, { t: 'reject', reason }); setTimeout(() => conn.close(), 300); };
      if (this.started) return reject('ゲームがすでに始まっています');
      if (this.active().length + 1 >= NET.maxHumans) return reject(`部屋が満員です（最大${NET.maxHumans}人）`);
      const taken = [this.name, ...this.active().map(m => m.name)];
      let name = cleanName(conn.metadata && conn.metadata.name);
      for (let k = 2; taken.includes(name); k++) name = cleanName(name).slice(0, 7) + k;
      this.members.push({ conn, name, seat: -1, sentLog: 0, reset: true, left: false, lastSeen: Date.now() });
      ui.players = Math.max(ui.players, this.active().length + 1);
      this.updateLobby();
    });
    conn.on('data', msg => {
      const m = this.members.find(x => x.conn === conn);
      if (!m || m.left || !msg) return;
      m.lastSeen = Date.now();
      if (msg.t === 'action') this.onAction(m, msg.action);
      else if (msg.t === 'bye') { this.memberLeft(m); conn.close(); }
    });
    conn.on('close', () => {
      const m = this.members.find(x => x.conn === conn);
      if (m) this.memberLeft(m);
    });
    conn.on('error', () => {});
  },
  /** 生存確認：参加者に ping を送り、音沙汰のない参加者を切断扱いにする */
  hostTick() {
    const now = Date.now();
    for (const m of this.active()) {
      if (now - m.lastSeen > NET.dropMs) { this.memberLeft(m); try { m.conn.close(); } catch (e) { /* 無視 */ } }
      else safeSend(m.conn, { t: 'ping' });
    }
  },
  lobbyInfo(forMember) {
    const people = [{ name: this.name, host: true }, ...this.active().map(m => ({ name: m.name }))];
    return {
      t: 'lobby', code: this.code, members: people,
      you: forMember ? 1 + this.active().indexOf(forMember) : 0,
      settings: { players: ui.players, nights: ui.nights, speed: ui.speed },
    };
  },
  updateLobby() {
    if (this.role !== 'host' || this.started) return;
    for (const m of this.active()) safeSend(m.conn, this.lobbyInfo(m));
    drawLobby(this.lobbyInfo(null));
  },
  memberLeft(m) {
    if (m.left) return;
    m.left = true;
    if (!this.started) {
      this.members = this.members.filter(x => x !== m);
      this.updateLobby();
      return;
    }
    // ゲーム中に抜けた人の席はCPUが引き継ぐ（以降の夜も）
    if (M && m.seat >= 0) {
      const seat = m.seat;
      const def = M.defs[seat];
      if (def && !def.away) {
        const pers = CONFIG.personalities[Math.floor(Math.random() * CONFIG.personalities.length)];
        M.defs[seat] = { ...def, away: true };
        M.personalities[seat] = pers;
        if (S) {
          const p = S.players[seat];
          Object.assign(p, { away: true, personality: pers, coop: pers.coop });
          log(S, `${p.name} の接続が切れた。以降はCPUが代わりに行動する`, 'cold');
        }
      }
      if (ui.remoteWait && ui.remoteWait.seat === seat) {
        const w = ui.remoteWait;
        ui.remoteWait = null;
        w.resolve(cpuChoose(S, seat));
      }
      if (S) render();
    }
  },
  /** 部屋のメンバーで席を決めてゲームを始める */
  start() {
    this.started = true;
    this.active().forEach((m, i) => { m.seat = i + 1; });
    for (const m of this.active()) safeSend(m.conn, { t: 'start', mySeat: m.seat });
    ui.mySeat = 0;
    startMatch();
  },
  seatDefs() {
    const defs = Array.from({ length: ui.players }, () => null);
    defs[0] = { name: this.name };
    for (const m of this.active()) defs[m.seat] = { name: m.name };
    return defs;
  },
  newNight() {
    for (const m of this.members) { m.sentLog = 0; m.reset = true; }
  },
  sendState(m) {
    if (!S || m.seat < 0) return;
    const view = viewOf(S, m.seat);
    const logAdd = visibleLog(S.log.slice(m.sentLog), m.seat);
    m.sentLog = S.log.length;
    safeSend(m.conn, { t: 'state', view, logAdd, reset: m.reset });
    m.reset = false;
  },
  broadcastState() {
    for (const m of this.active()) this.sendState(m);
  },
  awaitRemote(seat) {
    return new Promise((resolve, reject) => {
      const m = this.active().find(x => x.seat === seat);
      if (!m) { resolve(cpuChoose(S, seat)); return; }
      ui.remoteWait = { seat, resolve, reject };
      render();
    });
  },
  onAction(m, action) {
    const w = ui.remoteWait;
    if (!w || w.seat !== m.seat || !S) return;
    if (!isLegalAction(S, m.seat, action)) { this.sendState(m); return; }
    ui.remoteWait = null;
    w.resolve({ type: action.type, cardId: action.cardId });
  },
  backToLobby() {
    abortWaits();
    this.started = false;
    this.members = this.active();
    for (const m of this.members) m.seat = -1;
    S = null; V = null; M = null;
    showScreen('lobby');
    this.updateLobby();
  },

  /* ---- 参加者 ---- */
  async join(name, code) {
    this.name = cleanName(name);
    await loadPeerJS();
    await new Promise((resolve, reject) => {
      const peer = new window.Peer(NET.peerOptions);
      this.peer = peer;
      const timer = setTimeout(() => reject(new Error('timeout')), NET.joinTimeoutMs);
      const fail = err => { clearTimeout(timer); reject(err); };
      peer.on('error', err => {
        if (this.role === 'guest' && this.conn && this.conn.open) return; // 接続後の一時的なエラー
        fail(err);
      });
      peer.on('open', () => {
        const conn = peer.connect(NET.idPrefix + code, { reliable: true, serialization: 'json', metadata: { name: this.name } });
        conn.on('open', () => {
          clearTimeout(timer);
          Object.assign(this, { role: 'guest', conn, code, lastSeen: Date.now() });
          this.heartbeat = setInterval(() => {
            if (Date.now() - this.lastSeen > NET.dropMs) this.leave('ホストとの接続が切れました');
            else this.send({ t: 'ping' });
          }, NET.pingMs);
          resolve();
        });
        conn.on('data', msg => { this.lastSeen = Date.now(); this.onGuestData(msg); });
        conn.on('close', () => {
          if (this.role === 'guest' && !this.leaving) this.leave('ホストとの接続が切れました');
        });
        conn.on('error', () => {});
      });
    });
  },
  onGuestData(msg) {
    if (!msg || typeof msg.t !== 'string') return;
    switch (msg.t) {
      case 'lobby':
        this.lobby = msg;
        drawLobby(msg);
        if ($('screen-lobby').hidden) { S = null; V = null; showScreen('lobby'); }
        break;
      case 'reject':
        this.leave(msg.reason);
        break;
      case 'closed':
        this.leave(msg.reason || 'ホストが部屋を閉じました');
        break;
      case 'start':
        ui.mySeat = msg.mySeat;
        ui.ff = false;
        break;
      case 'state': {
        const wasWaiting = V && !msg.reset ? V.waitingSeat : -1;
        const log = msg.reset || !V ? [] : V.log;
        V = msg.view;
        V.log = log.concat(msg.logAdd || []);
        ui.sent = false;
        if (msg.reset) { resetBoard(V.n); showScreen('game'); }
        const myTurnNow = V.waitingSeat === ui.mySeat && V.players[ui.mySeat].alive;
        if (myTurnNow && wasWaiting !== ui.mySeat) {
          ui.selected = null; ui.pickStoke = false; ui.hint = '';
          Sound.play('yourTurn');
        }
        if (!$('screen-game').hidden || msg.reset) draw();
        break;
      }
      case 'sfx':
        Sound.play(msg.name, ...(Array.isArray(msg.args) ? msg.args : []));
        break;
      case 'chill':
        showChillCard(msg.info);
        clearTimeout(ui.chillTimer);
        ui.chillTimer = setTimeout(hideChillCard, Number(msg.ms) || 1000);
        break;
      case 'screen':
        if (V) showResultScreen(msg.kind);
        break;
    }
  },
};

/* ---------- 部屋（ロビー）画面 ---------- */
function drawLobby(info) {
  const isHost = Net.role === 'host';
  $('room-code').textContent = info.code;
  const people = info.members;
  const n = info.settings.players;
  let html = people.map((p, i) => `<li><i class="dot" style="background:${CONFIG.colors[i]}"></i>${esc(p.name)}
    ${p.host ? '<span class="tag">ホスト</span>' : ''}${i === info.you ? '<span class="tag you">あなた</span>' : ''}</li>`).join('');
  for (let i = people.length; i < n; i++) html += `<li class="cpu"><i class="dot" style="background:${CONFIG.colors[i]}"></i>CPU${i}<span class="tag">CPU</span></li>`;
  $('lobby-members').innerHTML = html;
  $('lobby-settings').hidden = !isHost;
  $('btn-lobby-start').hidden = !isHost;
  const speedName = { fast: '速い', normal: '普通', slow: '遅い' }[info.settings.speed];
  $('lobby-summary').textContent = `${n}人（CPU ${Math.max(0, n - people.length)}人）・${info.settings.nights}夜・CPUの速さ ${speedName}`;
  $('lobby-msg').textContent = isHost
    ? (people.length > 1 ? '全員そろったら「はじめる」を押してください' : '部屋コードを伝えて、参加を待っています')
    : 'ホストが始めるのを待っています';
  if (isHost) {
    document.querySelectorAll('#lobby-players button').forEach(b => { b.disabled = Number(b.dataset.v) < people.length; });
    syncSegs();
  }
  $('btn-copy-link').hidden = !/^https?:$/.test(location.protocol);
}
function inviteLink() {
  return `${location.origin}${location.pathname}?room=${Net.code}`;
}
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = 'コピーしました';
    setTimeout(() => { btn.textContent = old; }, 1200);
  } catch (e) { /* クリップボードが使えない環境 */ }
}
function onlineError(err) {
  const t = err && err.type;
  if (err && err.message === 'load') return 'オンライン機能を読み込めませんでした（ネットにつながっているか確認してください）';
  if (t === 'peer-unavailable') return '部屋が見つかりません。コードを確認してください';
  if (err && err.message === 'timeout') return '部屋につながりませんでした。もう一度試してください';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return '接続サーバーにつながりません。しばらくしてから試してください';
  if (t === 'browser-incompatible') return 'このブラウザはオンライン対戦に対応していません';
  return 'オンライン接続に失敗しました';
}
function readName() {
  const name = cleanName($('online-name').value);
  try { localStorage.setItem('campfire.name', name); } catch (e) { /* 無視 */ }
  return name;
}
async function onCreateRoom() {
  Sound.unlock();
  setOnlineBusy(true, '部屋を作っています…');
  try {
    await Net.host(readName());
    showScreen('lobby');
    Net.updateLobby();
    setOnlineBusy(false, '');
  } catch (err) {
    Net.reset();
    setOnlineBusy(false, onlineError(err));
  }
}
async function onJoinRoom() {
  Sound.unlock();
  const code = cleanCode($('join-code').value);
  if (code.length !== NET.codeLength) { $('online-msg').textContent = `部屋コード（${NET.codeLength}文字）を入力してください`; return; }
  setOnlineBusy(true, '部屋に入っています…');
  try {
    await Net.join(readName(), code);
    setOnlineBusy(false, '');
  } catch (err) {
    Net.reset();
    setOnlineBusy(false, onlineError(err));
  }
}
function setOnlineBusy(busy, msg) {
  for (const id of ['btn-create', 'btn-join', 'btn-start']) $(id).disabled = busy;
  $('online-msg').textContent = msg;
}

/* ---------- 開始画面 ---------- */
const segSyncs = [];
function syncSegs() { segSyncs.forEach(f => f()); }
function setupSeg(id, key, onChange) {
  const box = $(id);
  const sync = () => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(ui[key]))));
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      ui[key] = key === 'speed' ? b.dataset.v : Number(b.dataset.v);
      syncSegs();
      if (onChange) onChange();
    };
  });
  segSyncs.push(sync);
  sync();
}
function syncSoundButtons() {
  for (const id of ['sound-start', 'sound-in-game']) {
    const b = $(id);
    b.textContent = Sound.on ? '効果音 ON' : '効果音 OFF';
    b.setAttribute('aria-pressed', String(Sound.on));
  }
}
function toggleSound() {
  Sound.set(!Sound.on);
  syncSoundButtons();
  Sound.play('select');
}
function rulesHTML() {
  const C = CONFIG;
  const fuels = ['leaf', 'twig', 'log', 'wet'].map(t => {
    const d = C.cards[t];
    return `<li>${d.name}（${d.count}枚）：火力+${d.power}${d.minFire ? `、火力${d.minFire}以上のとき` : '、火力0でもくべられる'}${d.smolder ? '。次の火力減少を1回防ぐ（くすぶり）' : ''}</li>`;
  }).join('');
  return `
    <h3>目的</h3>
    <p>${Object.entries(C.roundsByPlayers).map(([n, r]) => `${n}人なら${r}`).join('・')}ラウンド後の夜明けに、生き残った中で<strong>体温がいちばん高い人</strong>の勝ち。体温（0〜${C.temp.max}、初期${C.temp.init}）が0になると凍死して脱落。全員が凍死したら最後に凍死した人の勝ち。</p>
    <h3>3夜制</h3>
    <p>3夜続けて遊ぶ。<strong>各夜の夜明けの体温がその夜の得点</strong>（凍死は${C.match.frozenPoints}点）で、3夜の合計がいちばん高い人の勝ち。夜ごとに体温・手札・火はリセットされるが、CPUの性格は3夜を通して変わらない。</p>
    <h3>手番：次から1つだけ</h3>
    <ul>
      <li><b>くべる</b>：燃料を1枚くべて火力を上げる。くべた人は体温+${C.stokeWarmth}</li>
      <li><b>暖まる</b>：火力1〜3で体温+1、4〜7で+2、8〜10で+3</li>
      <li><b>薪拾い</b>：山札から${C.gather.draw}枚引く。体温−${C.gather.cost}</li>
      <li><b>鍋を始める</b>：雪を使って鍋を置く</li>
      <li><b>鍋に入れる</b>：具材を鍋に入れ、取り分を1つ得る</li>
      <li><b>スープを飲む</b>：体温+${C.soupHeal}</li>
    </ul>
    <p>手番の終わりに<strong>火力−${C.decay}</strong>。そのとき火力が0なら、手番の人は「火を消した」として<strong>体温−${C.outPenalty}</strong>。</p>
    <h3>ラウンドの終わり</h3>
    <ul>
      <li><b>冷え込み</b>：カードをめくり全員の体温が下がる（普通の夜−1／冷える夜−2／吹雪−3）。火力${C.radiant.minFire}以上なら輻射熱で1軽減</li>
      <li><b>煮込み</b>：鍋があれば、火力${C.stew.upMinFire}以上で+1、火力0で−1。${C.stew.doneStage}に達すると完成し、入れた具材1つにつきスープ1枚が手札に入る</li>
    </ul>
    <h3>燃料</h3>
    <ul>${fuels}</ul>
    <h3>凍死したら</h3>
    <p>遺品を燃やして火力+${C.relicFire}。手札は次の席から時計回りに生存者へ1枚ずつ配られ、鍋の取り分は取り除かれる。</p>
    <h3>CPU</h3>
    <p>CPUは「協力型」か「自己中型」のどちらか。性格は最後の結果画面で明かされる。</p>
    <h3>オンライン対戦</h3>
    <p>「部屋を作る」と部屋コードが出るので、一緒に遊ぶ人に伝える。ほかの人はコードを入れて「コードで入る」。最大${NET.maxHumans}人で、空いた席はCPUが埋める。途中で抜けた人の席はCPUが引き継ぐ。部屋を作った人がページを閉じると部屋は終わる。</p>`;
}

$('btn-copy-link').onclick = e => copyText(inviteLink(), e.currentTarget);
$('btn-quit').onclick = () => {
  if (Net.role === 'guest') { if (confirm('部屋から退出しますか？（あなたの席はCPUが引き継ぎます）')) Net.leave(); return; }
  if (Net.role === 'host') { if (confirm('部屋を閉じて、全員の対戦を終わりにしますか？')) Net.leave(); return; }
  if (!S || S.over || confirm('このゲームをやめてタイトルに戻りますか？')) quitGame();
};
$('speed-in-game').onchange = e => { ui.speed = e.target.value; syncSegs(); };
try { $('online-name').value = localStorage.getItem('campfire.name') || ''; } catch (e) { /* 無視 */ }
{
  const room = cleanCode(new URLSearchParams(location.search).get('room'));
  if (room) $('join-code').value = room;
}
// タブを閉じたことをすぐ伝える（届かなくても生存確認で検出される）
window.addEventListener('pagehide', () => {
  if (Net.role === 'guest') Net.send({ t: 'bye' });
  else if (Net.role === 'host') Net.broadcast({ t: 'closed', reason: 'ホストが部屋を閉じました' });
});
window.addEventListener('beforeunload', e => {
  if (Net.role === 'host' && Net.active().length) { e.preventDefault(); e.returnValue = ''; }
});

// デバッグ・シミュレーション用
window.campfire = { CONFIG, createGame, legalActions, doAction, endTurn, revealChill, applyChill, stew, nextRound, ranking, cpuChoose, viewOf, state: () => S, view: () => V, net: Net };
</script>
